[package]
name = "helix-lsm"
version = "0.1.0"
edition = "2021"
authors = ["iKi <180210171+nff747@users.noreply.github.com>"]
description = "A high-throughput, lock-free distributed Log-Structured Merge-tree (LSM) database engine optimized for heavy write workloads."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/nff747/helix-lsm"
keywords = ["lsm-tree", "database", "lock-free", "storage-engine", "distributed"]
categories = ["database-implementations", "data-structures", "concurrency"]

[dependencies]
crossbeam-skiplist = "0.1.3"
crossbeam-epoch = "0.9.18"
parking_lot = "0.12.3"
crc32fast = "1.4.2"
byteorder = "1.5.0"
bytes = "1.6.0"
tokio = { version = "1.38.0", features = ["full"], optional = true }
serde = { version = "1.0.203", features = ["derive"] }
bincode = "1.3.3"
clap = { version = "4.5.7", features = ["derive"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
tempfile = "3.10.1"

[dev-dependencies]
rand = "0.8.5"

[[bin]]
name = "helix-bench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
